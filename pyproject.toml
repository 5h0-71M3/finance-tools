[project]
name = "finance-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "5h0-71M3", email = "104853808+5h0-71M3@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dirlin",
    "duckdb>=1.4.1",
    "jinja2>=3.1.6",
    "pandas",
    "pgeocode>=0.5.0",
    "pipeui",
    "python-calamine<0.8",
    "typer>=0.19.2",
]

[project.scripts]
finance-tools = "finance_tools.cli:app"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "finance-tools",
]

[tool.uv.sources]
dirlin = { git = "https://github.com/shotmendoza/directory-handler", rev = "retro" }
pipeui = { path = "../pipeui", editable = true }
