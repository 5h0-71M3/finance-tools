[project]
name = "finance-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "5h0-71M3", email = "104853808+5h0-71M3@users.noreply.github.com" }
]
requires-python = ">=3.12"
